name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: false

      - name: Install NDK and CMake
        run: |
          for pkg in "ndk;27.1.12297006" "ndk;27.0.12077973" "cmake;3.22.1"; do
            for attempt in 1 2 3; do
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" > /dev/null || true
              # "ndk;X" lands in $ANDROID_HOME/ndk/X; a failed install leaves no source.properties.
              [ -f "$ANDROID_HOME/${pkg/;//}/source.properties" ] && break
              [ "$attempt" = 3 ] && exit 1
              sleep 15
            done
          done

      - name: Build release APK (x86_64)
        run: |
          EXPO_NO_GIT_STATUS=1 npx expo prebuild -p android --clean --no-install
          (cd android && ./gradlew assembleRelease -x lintVitalAnalyzeRelease -PreactNativeArchitectures=x86_64)
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run e2e suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The default AVD is a 320x640dp screen: the keyboard hides the login fields. Same size class as a local Medium Phone.
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash -c 'MAESTRO_REPORT_DIR="$RUNNER_TEMP/maestro-junit" yarn jest -c e2e/jest.config.mjs --ci 2>&1 | tee "$RUNNER_TEMP/e2e.log"; rc=${PIPESTATUS[0]}; adb logcat -d > "$RUNNER_TEMP/logcat.txt" || true; exit $rc'

      - name: Summarize retries
        if: always()
        run: |
          log="$RUNNER_TEMP/e2e.log"
          [ -f "$log" ] || exit 0
          {
            echo "### E2E retries: $(grep -c ' RETRY ' "$log" || true)"
            grep 'LOGGING RETRY ERRORS' "$log" | sed 's/.*LOGGING RETRY ERRORS */- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/maestro-junit
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/logcat.txt
            ~/.maestro/tests
            android/app/build/outputs/apk/release/app-release.apk
